name: Sync portfolio projects

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-github.yml"
      - "scripts/sync-github.mjs"
      - "scripts/github-sync-lib.mjs"

permissions:
  contents: write

concurrency:
  group: portfolio-project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh public GitHub activity and source-file counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-github.mjs
      - name: Publish the feed without an AI session or site deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/github-projects.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub project activity [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
